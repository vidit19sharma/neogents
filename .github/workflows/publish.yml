name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Tag and manifest versions match
        run: |
          set -e
          a=$(node -p "require('./package.json').version")
          b=$(node -p "require('./.claude-plugin/plugin.json').version")
          [ "$GITHUB_REF_NAME" = "v$a" ] || { echo "tag mismatch: tag=$GITHUB_REF_NAME package.json=$a"; exit 1; }
          [ "$a" = "$b" ] || { echo "version mismatch: package.json=$a plugin.json=$b"; exit 1; }

      - name: Adapter unit tests
        run: node --test adapters/opencode/test/

      - name: Publish with provenance
        run: npm publish --provenance --access public
