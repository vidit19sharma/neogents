name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all shell scripts
        run: |
          set -e
          for f in hooks/scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck all shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2181: style-only ($? checks are deliberate in fail-open scripts)
          shellcheck --severity=warning --exclude=SC2181 hooks/scripts/*.sh

      - name: Validate all JSON files
        run: |
          set -e
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json settings.json hooks/hooks.json; do
            echo "jq . $f"
            jq . "$f" > /dev/null
          done

      - name: Hook scripts are executable
        run: |
          set -e
          for f in hooks/scripts/*.sh; do
            [ -x "$f" ] || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - name: Every hooks.json script exists
        run: |
          set -e
          for script in $(jq -r '.. | .command? // empty' hooks/hooks.json | sed 's|\${CLAUDE_PLUGIN_ROOT}/||'); do
            [ -f "$script" ] || { echo "MISSING: $script referenced in hooks.json"; exit 1; }
          done

      - name: Agent frontmatter sanity
        run: |
          set -e
          for f in agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "NO FRONTMATTER: $f"; exit 1; }
            grep -q '^name:' "$f" || { echo "MISSING name: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "MISSING description: $f"; exit 1; }
          done
          # Leaf agents must never carry the Agent tool (only neo may spawn)
          for f in agents/*.md; do
            [ "$f" = "agents/neo.md" ] && continue
            if awk '/^---$/{n++} n==1' "$f" | grep -E '^tools:.*\bAgent\b'; then
              echo "LEAF AGENT HAS Agent TOOL: $f"; exit 1
            fi
          done

      - name: Skill frontmatter matches directory name
        run: |
          set -e
          for d in skills/*/; do
            name=$(basename "$d")
            grep -q "^name: $name$" "$d/SKILL.md" || { echo "SKILL NAME MISMATCH: $d"; exit 1; }
          done

      - name: Spawn-guard whitelist covers all leaf agents
        run: |
          set -e
          for f in agents/*.md; do
            agent=$(basename "$f" .md)
            [ "$agent" = "neo" ] && continue
            grep -q "$agent" hooks/scripts/spawn-guard.sh || { echo "AGENT NOT IN SPAWN-GUARD: $agent"; exit 1; }
          done

  hook-behavior:
    name: Hook behavioral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jail.sh blocks and allows correctly
        run: |
          set -e
          j=hooks/scripts/jail.sh
          # shadow writing outside .neo -> block (exit 2)
          echo '{"agent_type":"neo-shadow","cwd":"/w","tool_input":{"file_path":"/w/src/app.ts"}}' | bash "$j" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]
          # shadow writing inside .neo/brain -> allow
          echo '{"agent_type":"neo-shadow","cwd":"/w","tool_input":{"file_path":"/w/.neo/brain/ACTIVE.md"}}' | bash "$j"
          # architect writing outside .neo/plans -> block
          echo '{"agent_type":"architect","cwd":"/w","tool_input":{"file_path":"/w/.neo/brain/ACTIVE.md"}}' | bash "$j" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]
          # architect writing a plan -> allow
          echo '{"agent_type":"architect","cwd":"/w","tool_input":{"file_path":"/w/.neo/plans/2026-01-01-x.md"}}' | bash "$j"
          # main thread (no agent_type) -> allow
          echo '{"cwd":"/w","tool_input":{"file_path":"/w/src/app.ts"}}' | bash "$j"
          # path traversal -> block
          echo '{"agent_type":"neo-shadow","cwd":"/w","tool_input":{"file_path":"/w/.neo/../src/app.ts"}}' | bash "$j" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]
          # namespaced agent id handled
          echo '{"agent_type":"neo:neo-shadow","cwd":"/w","tool_input":{"file_path":"/w/src/app.ts"}}' | bash "$j" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]

      - name: spawn-guard.sh whitelists roster, blocks strangers
        run: |
          set -e
          g=hooks/scripts/spawn-guard.sh
          echo '{"tool_input":{"subagent_type":"trinity"}}' | bash "$g"
          echo '{"tool_input":{"subagent_type":"morpheus"}}' | bash "$g"
          echo '{"tool_input":{"subagent_type":"totally-rogue"}}' | bash "$g" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]

      - name: stop-gate.sh honors stop_hook_active
        run: |
          echo '{"stop_hook_active":true}' | bash hooks/scripts/stop-gate.sh

      - name: stop-gate.sh blocks dirty code with clean brain, allows otherwise
        run: |
          set -e
          g="$PWD/hooks/scripts/stop-gate.sh"
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.email ci@neo && git config user.name ci
          mkdir -p .neo/brain
          echo focus > .neo/brain/ACTIVE.md
          git add -A && git commit -qm init
          # clean repo -> allow
          echo '{}' | bash "$g"
          # dirty code, clean brain -> block (exit 2)
          echo dirty > app.py
          echo '{}' | bash "$g" && { echo "should have blocked"; exit 1; } || [ $? -eq 2 ]
          # dirty code AND dirty brain -> allow
          echo update >> .neo/brain/ACTIVE.md
          echo '{}' | bash "$g"
          # dirty .neo only (no code changes) -> allow
          git add -A && git commit -qm second
          echo note >> .neo/brain/ACTIVE.md
          echo '{}' | bash "$g"
